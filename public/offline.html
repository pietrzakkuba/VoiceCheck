<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7a2436" />
    <title>Brak połączenia – VoiceCheck</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #fbf7ef; color: #382d29; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
      main { max-width: 32rem; padding: 2rem; }
      h1 { font-size: 1.6rem; }
      p { line-height: 1.6; }
      button { font: inherit; border: 0; border-radius: .625rem; background: #7a2436; color: white; padding: .8rem 1.2rem; cursor: pointer; }
      button:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { background: #211b19; color: #f7f0e5; } }
    </style>
  </head>
  <body>
    <main>
      <p><strong>VoiceCheck</strong></p>
      <h1>Brak połączenia z internetem</h1>
      <p>Połącz się z internetem, aby otworzyć aplikację. Twoje zapisane prezentacje, nagrania i ustawienia pozostają na tym urządzeniu.</p>
      <button type="button" onclick="window.location.reload()">Spróbuj ponownie</button>
    </main>
  </body>
</html>
